name: docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'README.md'
      - '.github/workflows/docs.yml'
      # the reference pages are generated from these at build (website/hooks/gen.py)
      - 'scripts/*.py'
      - 'tools/**.py'
      - 'dashboard_server.py'
      - 'dashboard_replay.py'
      - 'personas.py'
      - 'auth.py'
      - '*.py'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs deps
        run: pip install -r requirements-docs.txt pytest

      - name: Docs drift tests (every env var / tool / route documented, no secrets)
        run: pytest tests/test_docs.py -q

      - name: Build (strict) — regenerates website/reference/* from the code
        run: mkdocs build --clean --strict

      - name: Warn if a generated page was committed stale (the deployed site is already fresh)
        run: git diff --quiet -- website/reference || echo '::warning::website/reference on GitHub is behind the code — run mkdocs build locally and commit the regenerated pages'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
