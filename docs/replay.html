<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>scout · replay</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  body{font-family:system-ui,-apple-system,sans-serif;color:#e8e8f0}
  .rwrap{max-width:1100px;margin:0 auto;padding:16px}
  .rhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .rhead h1{font-size:18px;margin:0;display:flex;gap:8px;align-items:center}
  select,button{background:rgba(255,255,255,.06);color:#e8e8f0;border:1px solid rgba(255,255,255,.14);
    border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
  .rgrid{display:grid;grid-template-columns:1fr 360px;gap:16px}
  @media(max-width:860px){.rgrid{grid-template-columns:1fr}}
  .panel{background:rgba(20,20,30,.55);border:1px solid rgba(255,255,255,.10);border-radius:16px;
    padding:14px;backdrop-filter:blur(12px)}
  video{width:100%;border-radius:12px;background:#000;display:block}
  .vlabel{font-size:12px;opacity:.6;margin:6px 0 2px}
  .scrub{width:100%;margin:10px 0 4px}
  .timerow{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-size:13px;opacity:.8}
  .controls{display:flex;gap:8px;align-items:center;margin-top:8px}
  .graph{width:100%;height:90px;display:block;margin-top:10px;border-radius:8px;background:rgba(0,0,0,.25)}
  .eplist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .epitem{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);cursor:pointer;font-size:13px;
    border:1px solid transparent}
  .epitem:hover{background:rgba(255,255,255,.08)}
  .epitem.active{border-color:#6cf;background:rgba(100,200,255,.12)}
  .epitem .et{opacity:.6;font-size:11px}
  .events{max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:4px;margin-top:8px}
  .ev{padding:6px 9px;border-radius:8px;font-size:12.5px;cursor:pointer;border-left:3px solid #555;
    background:rgba(255,255,255,.03);line-height:1.35}
  .ev:hover{background:rgba(255,255,255,.08)}
  .ev.active{background:rgba(100,200,255,.16)}
  .ev .et{opacity:.55;font-variant-numeric:tabular-nums;margin-right:6px}
  .ev .badge{font-size:10px;padding:1px 6px;border-radius:6px;margin-right:5px;text-transform:uppercase;letter-spacing:.3px}
  .ev-reasoning{border-left-color:#7cf}    .b-reasoning{background:#1d3a4a}
  .ev-tool_use{border-left-color:#fc6}     .b-tool_use{background:#4a3a10}
  .ev-tool_result{border-left-color:#9c6}  .b-tool_result{background:#2a3a10}
  .ev-user_input{border-left-color:#c9f}   .b-user_input{background:#3a1d4a}
  .ev-assistant_end{border-left-color:#aaa}.b-assistant_end{background:#333}
  a.back{opacity:.7;text-decoration:none;color:#9cf;font-size:13px}
</style>
</head>
<body>
<!-- 🔐 auth gate -->
<div class="auth-gate hidden" id="authGate">
  <div class="auth-card glass" id="authCard">
    <div class="auth-logo">🛞🔐</div>
    <h2 id="authTitle">scout</h2>
    <p class="auth-sub" id="authSub">authenticating…</p>
    <div class="auth-field hidden" id="authBootstrapWrap">
      <label>Bootstrap token</label>
      <input id="authBootstrap" type="password" placeholder="one-time setup secret" autocomplete="off" />
    </div>
    <button class="auth-btn" id="authPrimary">✦ Continue</button>
    <div class="auth-msg" id="authMsg"></div>
    <p class="auth-foot">Passwordless · your key never leaves this device.</p>
  </div>
</div>

<div class="aurora"></div>
<div class="rwrap">
  <div class="rhead">
    <h1>🎞️ scout replay</h1>
    <a class="back" href="/">← live</a>
    <select id="dsSel"></select>
    <span id="dsInfo" style="opacity:.6;font-size:13px"></span>
  </div>

  <div class="rgrid">
    <div>
      <div class="panel">
        <video id="vid" preload="auto" playsinline></video>
        <div class="vlabel" id="vlabel">front</div>
        <input class="scrub" id="scrub" type="range" min="0" max="1000" value="0" step="1" />
        <div class="timerow"><span id="tCur">0.00s</span><span id="tDur">0.00s</span></div>
        <div class="controls">
          <button id="btnPlay">▶︎ play</button>
          <button id="btnView">⇆ rear</button>
          <button id="btnSpeed">1×</button>
          <span style="opacity:.6;font-size:12px" id="frameLbl">frame 0</span>
        </div>
        <canvas class="graph" id="graph"></canvas>
        <div style="font-size:11px;opacity:.55;margin-top:4px">
          ▮ linear &nbsp; ▮ angular &nbsp; ▮ speed(state) &nbsp;— click graph or events to seek
        </div>
      </div>
    </div>

    <div>
      <div class="panel">
        <strong style="font-size:13px;opacity:.8">episodes</strong>
        <div class="eplist" id="eplist"></div>
      </div>
      <div class="panel" style="margin-top:12px">
        <strong style="font-size:13px;opacity:.8">🔎 memory search</strong>
        <div style="display:flex;gap:6px;margin-top:8px">
          <input id="memQ" type="text" placeholder="find a chair, doorway, the G1…"
                 style="flex:1;background:rgba(255,255,255,.06);color:#e8e8f0;
                        border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 10px;font-size:13px" />
          <button id="memGo">go</button>
        </div>
        <div class="events" id="memHits" style="max-height:240px"></div>
      </div>

      <div class="panel" style="margin-top:12px">
        <strong style="font-size:13px;opacity:.8">🧠 reasoning timeline</strong>
        <div class="events" id="events"></div>
      </div>
    </div>
  </div>
</div>
<script src="js/auth.js"></script>
<script src="js/replay.js"></script>
</body>
</html>
