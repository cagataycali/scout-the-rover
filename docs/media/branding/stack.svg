<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360"
     role="img" aria-label="scout stack — sees, thinks, drives, remembers">
  <title>scout stack</title>
  <desc>Four glass tiles: SEE (front+rear), THINK (per-turn live state), DRIVE (auto-stop motion), REMEMBER (ECoT dataset).</desc>

  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1f2a1a"/>
      <stop offset="100%" stop-color="#0d130a"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e8e3c7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3d4a2a" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg2)"/>

  <!-- subtle camo blobs -->
  <g opacity="0.18">
    <ellipse cx="200"  cy="80"  rx="120" ry="40" fill="#4d5b32"/>
    <ellipse cx="1000" cy="300" rx="160" ry="50" fill="#6b7846"/>
    <ellipse cx="600"  cy="180" rx="220" ry="60" fill="#3d4a2a"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'SF Pro Text', sans-serif">
    <!-- tile template -->
    <!-- 1. SEE -->
    <g transform="translate(40,60)">
      <rect width="260" height="240" rx="22" fill="url(#tile)"
            stroke="#e8e3c7" stroke-opacity="0.2"/>
      <text x="24" y="50" font-size="34">👁️</text>
      <text x="24" y="92" font-size="22" font-weight="800" fill="#f3f1de">SEE</text>
      <text x="24" y="120" font-size="13" fill="#d8d3aa" opacity="0.85">
        front · rear · screenshot
      </text>
      <text x="24" y="148" font-size="12" fill="#bdb88c" opacity="0.8">
        Strands inline image blocks
      </text>
      <text x="24" y="166" font-size="12" fill="#bdb88c" opacity="0.8">
        the model literally sees
      </text>
      <!-- mini scope -->
      <g transform="translate(24,184)">
        <rect width="210" height="40" rx="8"
              fill="#0c1108" stroke="#ffce6b" stroke-opacity="0.5"/>
        <circle cx="20" cy="20" r="6" fill="#ffce6b">
          <animate attributeName="r" values="6;9;6" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <path d="M 36 28 L 80 14 L 130 26 L 175 12 L 200 24" fill="none"
              stroke="#a8d99a" stroke-width="1.6" filter="url(#soft)"/>
      </g>
    </g>

    <!-- 2. THINK -->
    <g transform="translate(330,60)">
      <rect width="260" height="240" rx="22" fill="url(#tile)"
            stroke="#e8e3c7" stroke-opacity="0.2"/>
      <text x="24" y="50" font-size="34">🧠</text>
      <text x="24" y="92" font-size="22" font-weight="800" fill="#f3f1de">THINK</text>
      <text x="24" y="120" font-size="13" fill="#d8d3aa" opacity="0.85">
        per-turn live state inject
      </text>
      <text x="24" y="148" font-size="12" fill="#bdb88c" opacity="0.8">
        battery · GPS · IMU · heading
      </text>
      <text x="24" y="166" font-size="12" fill="#bdb88c" opacity="0.8">
        FSM safety + curated tools
      </text>
      <!-- pulse rings -->
      <g transform="translate(130,210)">
        <circle r="10" fill="none" stroke="#ffce6b" stroke-opacity="0.6">
          <animate attributeName="r" values="10;30;10" dur="2.6s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0.7;0;0.7" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <circle r="6" fill="#ffce6b" opacity="0.9"/>
      </g>
    </g>

    <!-- 3. DRIVE -->
    <g transform="translate(620,60)">
      <rect width="260" height="240" rx="22" fill="url(#tile)"
            stroke="#e8e3c7" stroke-opacity="0.2"/>
      <text x="24" y="50" font-size="34">🛞</text>
      <text x="24" y="92" font-size="22" font-weight="800" fill="#f3f1de">DRIVE</text>
      <text x="24" y="120" font-size="13" fill="#d8d3aa" opacity="0.85">
        velocity · auto-stop · estop
      </text>
      <text x="24" y="148" font-size="12" fill="#bdb88c" opacity="0.8">
        rover_move / rover_navigate
      </text>
      <text x="24" y="166" font-size="12" fill="#bdb88c" opacity="0.8">
        crawl · slow · normal · fast · max
      </text>
      <!-- rolling road -->
      <g transform="translate(24,196)">
        <rect width="210" height="34" rx="8" fill="#0c1108"
              stroke="#a8d99a" stroke-opacity="0.4"/>
        <g>
          <rect x="10" y="14" width="16" height="6" rx="2" fill="#ffce6b" opacity="0.85">
            <animateTransform attributeName="transform" type="translate"
                              values="0,0;180,0" dur="1.6s" repeatCount="indefinite"/>
          </rect>
          <rect x="50" y="14" width="16" height="6" rx="2" fill="#ffce6b" opacity="0.55">
            <animateTransform attributeName="transform" type="translate"
                              values="0,0;180,0" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
          </rect>
          <rect x="90" y="14" width="16" height="6" rx="2" fill="#ffce6b" opacity="0.4">
            <animateTransform attributeName="transform" type="translate"
                              values="0,0;180,0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>
    </g>

    <!-- 4. REMEMBER -->
    <g transform="translate(910,60)">
      <rect width="260" height="240" rx="22" fill="url(#tile)"
            stroke="#e8e3c7" stroke-opacity="0.2"/>
      <text x="24" y="50" font-size="34">📦</text>
      <text x="24" y="92" font-size="22" font-weight="800" fill="#f3f1de">REMEMBER</text>
      <text x="24" y="120" font-size="13" fill="#d8d3aa" opacity="0.85">
        LeRobot v3 + ECoT sidecar
      </text>
      <text x="24" y="148" font-size="12" fill="#bdb88c" opacity="0.8">
        front+rear video · state · action
      </text>
      <text x="24" y="166" font-size="12" fill="#bdb88c" opacity="0.8">
        reasoning bound to frames
      </text>
      <!-- stacked tape -->
      <g transform="translate(24,184)">
        <rect width="210" height="14" rx="3" fill="#3d4a2a" stroke="#a8d99a" stroke-opacity="0.4"/>
        <rect y="20" width="210" height="14" rx="3" fill="#3d4a2a" stroke="#a8d99a" stroke-opacity="0.4" opacity="0.85"/>
        <rect y="40" width="210" height="14" rx="3" fill="#3d4a2a" stroke="#a8d99a" stroke-opacity="0.4" opacity="0.7"/>
        <circle cx="200" cy="7"  r="3" fill="#ffce6b"><animate attributeName="fill-opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
        <circle cx="200" cy="27" r="3" fill="#ffce6b"><animate attributeName="fill-opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/></circle>
        <circle cx="200" cy="47" r="3" fill="#ffce6b"><animate attributeName="fill-opacity" values="1;0.3;1" dur="1.5s" begin="0.7s" repeatCount="indefinite"/></circle>
      </g>
    </g>
  </g>
</svg>
