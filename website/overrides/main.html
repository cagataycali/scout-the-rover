{% extends "base.html" %}

{% block site_meta %}
  {{ super() }}
  <meta name="description" content="scout, a Strands agent that sees, thinks, talks and drives a FrodoBots Earth Rover Mini+ from a Jetson AGX Thor: voice, Telegram, a passkey-gated cockpit, a slow thinker, one shared brain, every drive recorded as a LeRobot dataset." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ page.title if page.title else config.site_name }} | scout" />
  <meta property="og:description" content="{{ config.site_description }}" />
  <meta property="og:image" content="{{ 'assets/mark.svg' | url }}" />
  <meta name="twitter:card" content="summary" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
{% endblock %}
