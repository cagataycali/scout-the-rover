<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- scout — a four-wheeled rover seen from the side, camera mast up. Original artwork, MIT with the repo. -->
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ee6d6"/><stop offset="1" stop-color="#16b9c4"/>
    </linearGradient>
  </defs>
  <!-- body -->
  <rect x="10" y="28" width="44" height="16" rx="5" fill="url(#b)"/>
  <!-- cabin / camera pod -->
  <rect x="20" y="18" width="20" height="12" rx="4" fill="#0a1621" stroke="#2ee6d6" stroke-width="2.5"/>
  <circle cx="30" cy="24" r="3" fill="#2ee6d6"/>
  <!-- antenna -->
  <path d="M44 20 v-10" stroke="#2ee6d6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="44" cy="8" r="2.5" fill="#ffc24a"/>
  <!-- wheels -->
  <circle cx="20" cy="46" r="8" fill="#0a1621" stroke="#f3fbfb" stroke-width="3"/>
  <circle cx="44" cy="46" r="8" fill="#0a1621" stroke="#f3fbfb" stroke-width="3"/>
  <circle cx="20" cy="46" r="2.5" fill="#2ee6d6"/>
  <circle cx="44" cy="46" r="2.5" fill="#2ee6d6"/>
</svg>
